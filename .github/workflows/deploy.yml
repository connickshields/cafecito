name: CI / Deploy

on:
  pull_request:
  push:
    branches: [main]

# Workflow-wide default: every job gets read-only access to the repository and
# nothing else, regardless of what the repository's default GITHUB_TOKEN
# permissions are set to. Jobs that need more must ask for it explicitly, which
# is what makes the `preview` job's `pull-requests: write` genuinely scoped to
# that job. `verify` and `deploy` need nothing beyond this: they only check out
# the repo, install, build, test, and talk to Cloudflare with its own API token.
permissions:
  contents: read

concurrency:
  # Never let two deploys race the same migration. Push (merge-to-main) runs
  # share a single "deploy" lane so they queue in order; PR runs get their
  # own per-ref lane so a later PR can never evict an already-queued deploy.
  group: ${{ github.event_name == 'push' && 'deploy' || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Build BEFORE testing. The worker test pool reads wrangler.toml, which
      # declares [assets] directory = "./dist". On a clean checkout that
      # directory does not exist yet, so the pool fails to boot with "The
      # assets directory specified does not exist" and collects zero tests.
      # This passes locally only because dist/ survives from a previous build.
      - run: npm run build
      - run: npm test
      - name: Validate wrangler config
        # --no-install pins this to the wrangler version installed by `npm ci`
        # from package.json/devDependencies (currently 4.72.0), never a
        # floating `npx` fetch of latest. CI must run the same wrangler the
        # tests were verified against.
        run: npx --no-install wrangler deploy --env "" --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The preview job runs `npm ci`, a build, and a REMOTE database migration
      # before it ever parses [env.preview]. Dry-running it here fails a broken
      # preview config in seconds instead of after that work.
      #
      # Scope, honestly: --dry-run returns before making any API call, so this
      # catches config parse errors, bad bindings, and bundle failures only. It
      # does NOT validate routes -- it cannot tell you whether `routes = []` is
      # present or whether preview would steal the production custom domain.
      # That guardrail is enforced by reading wrangler.toml, not by this step.
      - name: Validate preview wrangler config
        run: npx --no-install wrangler deploy --env preview --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Migrations run before code. Every migration must therefore be
      # backward-compatible with the currently deployed Worker.
      - name: Apply D1 migrations
        run: npx --no-install wrangler d1 migrations apply cafecito --remote
      - name: Deploy Worker
        run: npx --no-install wrangler deploy --env ""

  preview:
    needs: verify
    # Fork PRs and Dependabot PRs do not receive repository secrets, so
    # wrangler cannot authenticate. Skipping them keeps their checks green
    # rather than training us to ignore a permanently red X. They still run
    # `verify`. The two checks exclude different things: Dependabot opens
    # PRs from a branch in this repository (not a fork), so the repo-name
    # check alone does not catch it — the actor check is needed too.
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Scoped to this job only. The workflow-level default above is
      # `contents: read` with no pull-requests scope, and a job-level block
      # replaces that default wholesale rather than adding to it -- so `verify`
      # and `deploy` genuinely cannot write to pull requests.
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # A PR that adds a migration applies it here and then runs the app
      # against it, so a broken migration surfaces in its own PR rather than
      # on merge to main.
      - name: Apply migrations to the preview database
        run: npx --no-install wrangler d1 migrations apply cafecito-preview --remote --env preview
      # `versions upload` takes no traffic. The alias makes the URL
      # deterministic and reassigns to the newest version on each push, so the
      # link stays valid for the life of the PR.
      - name: Upload preview version
        id: upload
        # The URL is READ OUT OF WRANGLER'S OUTPUT, never composed here.
        # Wrangler prints "Version Preview Alias URL:" only when preview URLs
        # are actually enabled on the Worker, so parsing it makes the comment
        # self-verifying: no line, no comment, red check. Composing the URL
        # from a repo variable instead would post a dead link on a green run.
        run: |
          # tee would otherwise mask a non-zero exit from wrangler.
          set -o pipefail
          npx --no-install wrangler versions upload --env preview --preview-alias pr-${{ github.event.pull_request.number }} 2>&1 | tee upload.log
          url=$(tr -d '\r' < upload.log | sed -n 's/.*Version Preview Alias URL:[[:space:]]*//p' | tail -n 1)
          if [ -z "$url" ]; then
            echo "::error::wrangler did not print a 'Version Preview Alias URL:' line. Preview URLs are not enabled on the cafecito-preview Worker. wrangler versions upload only READS the subdomain settings, so it cannot turn them on: the account needs one 'wrangler triggers deploy --env preview' with preview_urls = true in wrangler.toml. See README, 'PR previews' -> one-time setup."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment the preview URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.upload.outputs.url }}
        run: |
          marker="<!-- cafecito-preview-url -->"
          url="$URL"
          # The alias URL is stable across pushes, so comment once rather than
          # editing or stacking a new comment on every commit.
          if gh pr view "$PR" --json comments --jq '.comments[].body' | grep -qF "$marker"; then
            echo "Preview comment already present: $url"
            exit 0
          fi
          # printf with a single-quoted format string: the body contains
          # backticks, which bash would run as command substitution inside a
          # double-quoted string.
          # shellcheck disable=SC2016
          body=$(printf '%s\n**Preview:** %s\n\nRuns against the throwaway `cafecito-preview` database, not production. The barista view renders but its API returns 403 — Cloudflare Access does not cover this hostname.\n' "$marker" "$url")
          gh pr comment "$PR" --body "$body"
